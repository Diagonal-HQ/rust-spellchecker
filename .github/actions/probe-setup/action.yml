name: Probe setup
description: Installs the Rust toolchain for Probe reviews.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Build crate
      shell: bash
      run: cargo build --all-targets

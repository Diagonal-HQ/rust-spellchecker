[files]
extend-exclude = [
  "node_modules/**",
  "vendor/**",
  "public/**",
  "storage/**",
  "app/ai/eval-comparisons/**",
  "dist/**",
  "build/**",
  "coverage/**",
  "**/generated/**",
  "**/*.generated.*",
  "**/*.d.ts",
  "package-lock.json",
  "composer.lock",
  "patches.lock.json",
  "**/*.min.js",
  "**/*.snap",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*Test.php",
  "resources/js/lib/icons-data.ts",
]

[default]
check-filename = false
locale = "en"
